[project]
name = "dizzycoffee"
version = "0.1.0"
description = "Local, app-free control for the Spinn bean-to-cup coffee maker (read-only client + protocol docs)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",
    "awsiotsdk>=1.21",
]

[project.scripts]
dizzy = "dizzycoffee.cli:main"

[project.urls]
Homepage = "https://github.com/spiegela/dizzycoffee"
Repository = "https://github.com/spiegela/dizzycoffee"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dizzycoffee"]
