name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch Home Assistant / HACS validation changes between pushes.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest (Home Assistant manifest, strings, services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: the integration isn't in home-assistant/brands (yet).
          # topics: the GitHub repo has no topics yet; add some (e.g. home-assistant,
          # hacs, homeassistant-integration) under About on GitHub, then drop this.
          ignore: brands topics

  tests:
    name: Tests (pytest, Home Assistant test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        # Includes tests/test_vendor_sync.py: fails if custom_components/spinn/_vendor/
        # has drifted from the dizzycoffee/ client at the repo root.
        run: python -m pytest -p no:cacheprovider
